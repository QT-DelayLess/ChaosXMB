name: Windows WPF build
on:
  push:
  workflow_dispatch:
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore ChaosXMB.sln
      - name: Build
        run: dotnet build ChaosXMB.sln --configuration Release --no-restore
